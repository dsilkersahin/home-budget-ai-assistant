[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "home-budget-ai-assistant"
version = "0.1.0"
description = "Local, exact-decimal household spending analysis"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
web = ["fastapi==0.115.12", "starlette==0.46.2", "anyio==4.9.0", "uvicorn==0.34.2", "python-multipart==0.0.32", "openpyxl==3.1.5", "xlrd==2.0.2"]
dev = ["httpx==0.28.1", "xlwt==1.3.0", "playwright==1.65.1"]

[tool.setuptools.packages.find]
include = ["budget*"]

[tool.setuptools.package-data]
budget = ["static/*"]
